name: CI

on:
  push:
    branches:
      - main
      - copilot/garage-sale-location-privacy
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Build Functions
        run: npm run build:functions

      - name: Test Functions username helpers
        run: npm --prefix functions run test:username

      - name: Test Functions public profile
        run: npm --prefix functions run test:public-profile

      - name: Type-check
        run: npm run type-check

      - name: Run unit tests
        run: npm test

      - name: Build production app
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-build-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-build-placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-build-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-build-placeholder.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:ci-build-placeholder"

      - name: Run Firestore Emulator rules tests
        run: npm run test:rules
