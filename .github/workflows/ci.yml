name: CI

on:
  push:
    branches:
      - main
      - copilot/garage-sale-location-privacy
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Build Functions
        run: npm run build:functions

      - name: Test Functions username helpers
        run: npm --prefix functions run test:username

      - name: Test Functions public profile
        run: npm --prefix functions run test:public-profile

      - name: Test Functions and projection audit integration with emulators
        run: npm run test:functions:integration

      - name: Type-check
        run: npm run type-check

      - name: Run unit tests
        run: npm test

      - name: Build production app
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-build-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-build-placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-build-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-build-placeholder.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:ci-build-placeholder"

      - name: Run Firestore Emulator rules tests
        run: npm run test:rules

      - name: Compare event audit with Firestore Rules
        shell: bash
        run: |
          output="$RUNNER_TEMP/audit-rules-parity.tap"
          set +e
          env -u FIREBASE_EMULATOR_HUB -u FIRESTORE_EMULATOR_HOST \
            -u FIREBASE_DATABASE_EMULATOR_HOST -u FIREBASE_STORAGE_EMULATOR_HOST \
            -u FIREBASE_AUTH_EMULATOR_HOST -u FUNCTIONS_EMULATOR_HOST \
            -u FIREBASE_EMULATORS_PATH \
            ./node_modules/.bin/firebase emulators:exec \
            --project demo-yardsale-hub --only firestore \
            'env -u FIREBASE_EMULATOR_HUB node --test --test-reporter=tap --test-name-pattern="^tracked Rules agree with representative conservative assessments$" functions/test/audit-production-events.test.cjs > "$RUNNER_TEMP/audit-rules-parity.tap"'
          status=$?
          set -e
          if [ -f "$output" ]; then cat "$output"; fi
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if ! grep -Eq '^ok [0-9]+ - tracked Rules agree with representative conservative assessments$' "$output"; then
            echo "::error::Audit comparison was skipped or not found."
            exit 1
          fi
